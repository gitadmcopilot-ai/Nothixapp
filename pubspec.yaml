name: nothixapp
description: A Git-centric social/chat platform for developers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Markdown Support
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1
  
  # Syntax Highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  
  # Cryptography for ED25519
  cryptography: ^2.5.0
  crypto: ^3.0.3
  
  # State Management
  provider: ^6.1.1
  
  # Git-like diffing
  diff_match_patch: ^0.4.1
  
  # Time handling
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
